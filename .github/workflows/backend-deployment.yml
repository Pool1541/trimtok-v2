name: Deploy Backend — SST

on:
  push:
    branches:
      - main
    paths:
      - "back/src/**"
      - "back/sst.config.ts"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      YTDLP_VERSION: "2026.03.17"
      FFMPEG_VERSION: "n7.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache yt-dlp binary
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: back/layers/ytdlp/bin/yt-dlp
          key: ytdlp-${{ env.YTDLP_VERSION }}-linux-arm64

      - name: Download yt-dlp (arm64)
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux_aarch64" \
            -o back/layers/ytdlp/bin/yt-dlp
          chmod +x back/layers/ytdlp/bin/yt-dlp

      - name: Cache ffmpeg binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: back/layers/ffmpeg/bin/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-linux-arm64

      - name: Download ffmpeg (arm64)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-${FFMPEG_VERSION}-latest-linuxarm64-gpl-${FFMPEG_VERSION}.tar.xz" \
            | tar -xJ --strip-components=2 --wildcards -C back/layers/ffmpeg/bin '*/bin/ffmpeg'
          chmod +x back/layers/ffmpeg/bin/ffmpeg

      - name: Deploy with SST
        run: npm run deploy:back
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}